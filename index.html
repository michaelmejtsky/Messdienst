<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <meta name="theme-color" content="#25346f">
  <meta name="application-name" content="Messdienst">
  <meta name="apple-mobile-web-app-title" content="Messdienst">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta property="og:title" content="Messdienst – Feuerwehr St. Pölten-Stadt">
  <meta property="og:description" content="Interne Messdienst- und Prüfröhrchen-App der Feuerwehr St. Pölten-Stadt">

  <link rel="manifest" href="./manifest.json?v=1">
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png?v=1">
  <link rel="icon" type="image/png" sizes="512x512" href="./icon-512.png?v=1">
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png?v=1">

  <title>Messdienst – Feuerwehr St. Pölten-Stadt</title>

  <style>
    *{box-sizing:border-box}

    html,body{
      margin:0;
      width:100%;
      height:100%;
      font-family:Arial,Helvetica,sans-serif;
      background:#f3f5f9;
      color:#192230;
      overflow:hidden;
    }

    #app{
      position:fixed;
      inset:0;
      width:100%;
      height:100%;
      border:0;
      display:block;
      background:#f3f5f9;
    }

    #loading{
      position:fixed;
      inset:0;
      z-index:50;
      display:flex;
      align-items:center;
      justify-content:center;
      flex-direction:column;
      gap:14px;
      padding:24px;
      text-align:center;
      background:
        radial-gradient(circle at top right,rgba(255,255,255,.14),transparent 30%),
        linear-gradient(135deg,#25346f,#34499a);
      color:white;
      font-weight:800;
      transition:opacity .25s ease;
    }

    #loading.hide{
      opacity:0;
      pointer-events:none;
    }

    .loading-logo{
      width:104px;
      height:104px;
      padding:8px;
      object-fit:contain;
      border-radius:24px;
      background:#fff;
      box-shadow:0 16px 40px rgba(0,0,0,.18);
    }

    .loading-title{
      margin-top:4px;
      font-size:22px;
      font-weight:900;
    }

    .loading-subtitle{
      color:rgba(255,255,255,.78);
      font-size:12px;
      letter-spacing:.06em;
      text-transform:uppercase;
    }

    .spinner{
      width:38px;
      height:38px;
      margin-top:5px;
      border:4px solid rgba(255,255,255,.25);
      border-top-color:white;
      border-radius:50%;
      animation:spin .8s linear infinite;
    }

    @keyframes spin{to{transform:rotate(360deg)}}

    #offlineBanner{
      position:fixed;
      left:50%;
      top:14px;
      z-index:120;
      display:none;
      transform:translateX(-50%);
      padding:10px 15px;
      border-radius:999px;
      background:#912018;
      color:#fff;
      font-size:12px;
      font-weight:900;
      box-shadow:0 8px 20px rgba(0,0,0,.16);
    }

    #offlineBanner.show{display:block}

    /* Installation */
    #installOverlay{
      position:fixed;
      inset:0;
      z-index:9999;
      display:none;
      align-items:flex-end;
      justify-content:center;
      padding:16px;
      background:rgba(15,22,42,.72);
      backdrop-filter:blur(7px);
      -webkit-backdrop-filter:blur(7px);
    }

    #installOverlay.show{display:flex}

    .install-card{
      width:min(450px,100%);
      margin-bottom:env(safe-area-inset-bottom);
      padding:26px 21px;
      border-radius:25px;
      background:#fff;
      box-shadow:0 28px 80px rgba(0,0,0,.32);
      text-align:center;
    }

    .install-icon{
      width:82px;
      height:82px;
      margin:0 auto 12px;
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
      border-radius:20px;
      background:#edf0f7;
    }

    .install-icon img{
      width:100%;
      height:100%;
      object-fit:contain;
    }

    .install-brand{
      color:#748094;
      font-size:10px;
      font-weight:900;
      letter-spacing:.09em;
    }

    .install-card h2{
      margin:7px 0 8px;
      color:#25346f;
      font-size:23px;
      font-weight:900;
    }

    .install-card p{
      margin:8px 0 0;
      color:#718096;
      font-size:13px;
      line-height:1.5;
    }

    .install-button{
      width:100%;
      min-height:54px;
      margin-top:20px;
      border:0;
      border-radius:14px;
      background:linear-gradient(135deg,#25346f,#34499a);
      color:#fff;
      font-size:14px;
      font-weight:900;
      cursor:pointer;
    }

    .install-later{
      width:100%;
      min-height:48px;
      margin-top:9px;
      border:0;
      border-radius:14px;
      background:#edf0f5;
      color:#354052;
      font-size:12px;
      font-weight:900;
      cursor:pointer;
    }

    #iosHelp{
      display:none;
      margin-top:16px;
      padding:17px;
      border-radius:15px;
      background:#eef1fb;
      color:#25346f;
      font-size:13px;
      line-height:1.5;
      text-align:left;
    }
  </style>
</head>

<body>

  <div id="offlineBanner">Keine Internetverbindung</div>

  <iframe
    id="app"
    title="Messdienst"
    allow="clipboard-read; clipboard-write"
  ></iframe>

  <div id="loading">
    <img class="loading-logo" src="./icon-512.png?v=1" alt="Feuerwehr St. Pölten-Stadt">
    <div class="loading-subtitle">Feuerwehr St. Pölten-Stadt</div>
    <div class="loading-title">Messdienst wird geladen …</div>
    <div class="spinner"></div>
  </div>

  <div id="installOverlay">
    <div class="install-card">
      <div class="install-icon">
        <img src="./icon-192.png?v=1" alt="Messdienst">
      </div>

      <div class="install-brand">FEUERWEHR ST. PÖLTEN-STADT</div>

      <h2>Messdienst installieren</h2>

      <p>
        Die Messdienst-Datenbank kann als App auf diesem Gerät installiert werden.
      </p>

      <button id="installButton" class="install-button" type="button">
        App installieren
      </button>

      <button id="installLater" class="install-later" type="button">
        Später
      </button>

      <div id="iosHelp">
        <strong>iPhone / iPad:</strong><br>
        In Safari unten auf <strong>Teilen</strong> tippen und danach
        <strong>„Zum Home-Bildschirm“</strong> auswählen.
      </div>
    </div>
  </div>

  <script src="./config.js?v=1"></script>

  <script>
    const appFrame = document.getElementById('app');
    const loading = document.getElementById('loading');
    const offlineBanner = document.getElementById('offlineBanner');
    const installOverlay = document.getElementById('installOverlay');
    const installButton = document.getElementById('installButton');
    const installLater = document.getElementById('installLater');
    const iosHelp = document.getElementById('iosHelp');

    const cfg = window.MESSDIENST_CONFIG || {};
    const appUrl = cfg.appUrl || '';

    if (appUrl) {
      appFrame.src = appUrl;
    }

    appFrame.addEventListener('load', () => {
      setTimeout(() => loading.classList.add('hide'), 250);
    });

    setTimeout(() => {
      loading.classList.add('hide');
    }, 12000);

    function updateOnlineStatus() {
      offlineBanner.classList.toggle('show', !navigator.onLine);
    }

    window.addEventListener('online', updateOnlineStatus);
    window.addEventListener('offline', updateOnlineStatus);
    updateOnlineStatus();

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js?v=1');
      });
    }

    let deferredPrompt = null;

    const isIos = /iphone|ipad|ipod/i.test(navigator.userAgent);
    const isStandalone =
      window.matchMedia('(display-mode: standalone)').matches ||
      window.navigator.standalone === true;

    window.addEventListener('beforeinstallprompt', event => {
      event.preventDefault();
      deferredPrompt = event;

      if (!isStandalone && sessionStorage.getItem('mdInstallLater') !== '1') {
        installOverlay.classList.add('show');
      }
    });

    if (isIos && !isStandalone && sessionStorage.getItem('mdInstallLater') !== '1') {
      setTimeout(() => {
        iosHelp.style.display = 'block';
        installButton.textContent = 'Installationshinweis anzeigen';
        installOverlay.classList.add('show');
      }, 1200);
    }

    installButton.addEventListener('click', async () => {
      if (isIos) {
        iosHelp.style.display = 'block';
        return;
      }

      if (!deferredPrompt) {
        installOverlay.classList.remove('show');
        return;
      }

      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt = null;
      installOverlay.classList.remove('show');
    });

    installLater.addEventListener('click', () => {
      sessionStorage.setItem('mdInstallLater', '1');
      installOverlay.classList.remove('show');
    });
  </script>

</body>
</html>

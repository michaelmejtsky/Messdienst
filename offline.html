<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#25346f">
  <title>Messdienst – Offline</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;font-family:Arial,Helvetica,sans-serif;background:#f3f5f9;color:#192230}
    body{display:flex;align-items:center;justify-content:center;padding:22px}
    .card{width:min(440px,100%);background:#fff;border-radius:24px;padding:30px;text-align:center;box-shadow:0 25px 70px rgba(0,0,0,.18)}
    img{width:92px;height:92px;object-fit:contain;margin-bottom:14px}
    h1{color:#25346f;margin:0 0 8px;font-size:25px}
    p{color:#748094;line-height:1.55;margin:0}
    button{width:100%;min-height:50px;margin-top:20px;border:0;border-radius:14px;background:linear-gradient(135deg,#25346f,#34499a);color:#fff;font-weight:900}
  </style>
</head>
<body>
  <div class="card">
    <img src="./icon-192.png" alt="Feuerwehr St. Pölten-Stadt">
    <h1>Keine Verbindung</h1>
    <p>Die Messdienst-App benötigt für die Datenbank aktuell eine Internetverbindung. Bitte Verbindung prüfen und erneut versuchen.</p>
    <button onclick="location.reload()">Erneut versuchen</button>
  </div>
</body>
</html>
